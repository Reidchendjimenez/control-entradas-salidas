[tool.flet]
product = "Lycoris Control"
org = "com.reidchend"
android.adaptive_icon_background = "#1A1A1A"

# Compilación a .pyc activada por defecto en 0.86 -> mantenerla para arranque rápido
compile.app = true
compile.packages = true

# Android: empaquetado nativo moderno (mmap desde APK, sin extracción)
android.extract_packages = []  # solo si algún paquete falla con zipimport
android.legacy_packaging = false  # moderno por defecto
android.proguard_rules = ""       # reglas extra si usa PyJNIus
# android.gradle_properties = {}  # ej. org.gradle.jvmargs = "-Xmx3G"

# Web: renderer canvaskit por defecto en 0.86 (más rápido para RawImage/Matplotlib)
web.renderer = "canvaskit"

exclude = [
    "*.db",
    "*.db-shm",
    "*.db-wal",
    ".control_entradas_cache/",
    "logs/",
    "lycoris_local.db",
    "control_entradas_salidas.db",
    "config/db_config.py",   # credenciales: no empaquetar en web/build público
    "config/.env",           # no empaquetar .env
    ".env",
]

[project]
name = "lycoris-control"
version = "1.3.22"
description = "Control de Entradas y Salidas"
requires-python = ">=3.12,<3.13"  # pin 3.12 para wheels nativas (pillow, pg8000, etc.)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"