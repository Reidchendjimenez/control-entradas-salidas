name: control_entradas_salidas
description: Control de Entradas y Salidas + POS (migración Flet -> Flutter)
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (Postgres REST, auth, storage, realtime)
  supabase_flutter: ^2.8.0
  # Base de datos local offline-first
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # Red y conectividad
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  # Almacenamiento seguro (credenciales, tokens, .env-like)
  flutter_secure_storage: ^9.2.0
  # Utilidades
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  crypto: ^3.0.3
  file_selector: ^1.0.3
  file_selector_web: ^0.9.5
  excel: ^4.0.6
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icono_azul.png
