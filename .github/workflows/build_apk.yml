name: Build Android APK (Flet 0.86)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev libpango1.0-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet 0.86
        run: |
          pip install flet==0.86.5 cookiecutter setuptools wheel

      - name: Build APK
        run: |
          # 1. Aceptar licencias de Android
          yes | flutter doctor --android-licenses || true

          # 2. Inyectar Secretos en .env (para compatibilidad con código legacy)
          cat << EOF > .env
          DB_TYPE=postgresql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=6543
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          FLET_APP_NAME="Lycoris Control"
          UPDATE_URL=https://raw.githubusercontent.com/reidchend/control-entradas-salidas/main/version.json
          WHATSAPP_API_KEY=${{ secrets.WHATSAPP_API_KEY }}
          EOF

          mkdir -p config
          cp .env config/.env

          # Credenciales empaquetadas: config/db_config.py (módulo Python normal)
          # SIEMPRE viaja dentro del APK (a diferencia de .env, archivo oculto).
          # config/config.py lo usa como respaldo si no encuentra el .env.
          cat << EOF > config/db_config.py
          DB_TYPE = "postgresql"
          DB_HOST = "${{ secrets.DB_HOST }}"
          DB_PORT = "6543"
          DB_NAME = "${{ secrets.DB_NAME }}"
          DB_USER = "${{ secrets.DB_USER }}"
          DB_PASSWORD = "${{ secrets.DB_PASSWORD }}"
          SQLITE_PATH = "./control_entradas_salidas.db"
          EOF

          # 3. Google Services (requerido para FCM/notificaciones)
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

          # 4. Construcción con Flet 0.86
          # - python-version 3.12: pin para wheels nativas (pillow, pg8000, certifi, etc.)
          # - compile on by default (pyproject.toml compile.app/packages = true) -> .pyc precompilados
          # - android modern packaging (mmap .so desde APK, sin extracción)
          # - web renderer canvaskit (pyproject.toml web.renderer = "canvaskit")
          flet build apk \
            --product "Lycoris Control" \
            --org "com.reidchend.lycoris" \
            --python-version 3.12 \
            --build-number 8 \
            --build-version "1.3.22" \
            --no-rich-output

      - name: Rename APK
        run: |
          find build/apk -name "*.apk" -exec mv {} build/apk/LycorisControl.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LycorisControl-APK
          path: build/apk/LycorisControl.apk